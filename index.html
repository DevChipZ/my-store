<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRECISION | Hyper-Local Client Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Space Grotesk', 'sans-serif'],
                        display: ['Syncopate', 'sans-serif']
                    },
                    colors: { 
                        darkBg: '#030305',
                        darkSurface: '#0d0d12',
                        neonCyan: '#00F0FF',
                        neonPurple: '#9D00FF',
                        neonPink: '#FF007F'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        h1, h2, .brand-text { font-family: 'Syncopate', sans-serif; }
        .glass-panel { background: rgba(13, 13, 18, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .cyber-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 25px rgba(0, 240, 255, 0.2);
        }
        .cyber-btn:hover {
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.6), 0 0 60px rgba(157, 0, 255, 0.4);
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col selection:bg-neonCyan selection:text-black overflow-x-hidden">

    <!-- Top Ticker -->
    <div class="bg-gradient-to-r from-neonCyan via-neonPurple to-neonPink text-white text-[10px] uppercase tracking-[0.3em] py-2.5 text-center font-extrabold shadow-lg z-50">
        ⚡ Precision Intelligence Matrix • Multi-Tier Protocol Active
    </div>

    <!-- Header -->
    <header class="glass-panel border-b border-white/10 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-neonCyan to-neonPurple flex items-center justify-center shadow-lg">
                    <i class="fas fa-crosshairs text-black text-lg"></i>
                </div>
                <span class="brand-text text-lg md:text-xl font-bold tracking-widest text-white">CLIENT FINDER</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-[10px] font-mono uppercase tracking-widest text-neonCyan bg-cyan-500/10 border border-cyan-500/30 px-3 py-1.5 rounded-full">
                    ● System Live
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-12 flex-1 w-full">
        <div class="text-center mb-10">
            <span class="inline-block py-2 px-6 border border-neonPurple/40 text-neonCyan text-[10px] font-bold tracking-[0.3em] uppercase mb-4 bg-purple-500/5 rounded-full">
                Target Generation Engine
            </span>
            <h1 class="text-3xl md:text-5xl font-black tracking-widest uppercase mb-3 text-white">
                Hyper-Local <span class="text-transparent bg-clip-text bg-gradient-to-r from-neonCyan via-neonPurple to-neonPink">Matrix</span>
            </h1>
            <p class="text-gray-400 text-xs md:text-sm tracking-wide">
                Target local businesses by niche, distance tiers, and secure automated tracking.
            </p>
        </div>

        <!-- Form Card -->
        <div class="glass-panel border border-white/10 rounded-3xl p-6 md:p-10 shadow-2xl relative">
            <div class="absolute -top-20 -right-20 w-64 h-64 bg-neonCyan/10 rounded-full blur-[100px] pointer-events-none"></div>
            
            <form id="searchForm" class="space-y-6 relative z-10">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-neonCyan mb-2">
                        <i class="fas fa-envelope mr-2"></i>Your Email (1-Time Free Trial Tracker)
                    </label>
                    <input type="email" id="email" required placeholder="your-email@gmail.com" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-xs font-semibold tracking-wider text-white placeholder-gray-500 focus:outline-none focus:border-neonCyan transition">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-gray-300 mb-2">
                            <i class="fas fa-bullseye mr-2"></i>Client Type / Niche
                        </label>
                        <input type="text" id="client_type" required placeholder="e.g., cafe, gym, clinic" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-xs font-semibold tracking-wider text-white placeholder-gray-500 focus:outline-none focus:border-neonCyan transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-gray-300 mb-2">
                            <i class="fas fa-city mr-2"></i>Center Location / City
                        </label>
                        <input type="text" id="city" required placeholder="e.g., Chennai" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-xs font-semibold tracking-wider text-white placeholder-gray-500 focus:outline-none focus:border-neonCyan transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-gray-300 mb-3">
                        <span class="text-neonPurple">⚙️</span> Select Distance Radius Tier & Pricing
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <label class="flex items-center p-4 rounded-2xl bg-white/5 border border-white/10 hover:border-neonCyan cursor-pointer transition">
                            <input type="radio" name="tier" value="25" checked class="accent-neonCyan mr-3">
                            <div>
                                <div class="text-xs font-bold text-white">Free Tier (0 – 25 km)</div>
                                <div class="text-[10px] text-neonCyan uppercase font-mono mt-0.5">1-Time Use Only</div>
                            </div>
                        </label>
                        <label class="flex items-center p-4 rounded-2xl bg-white/5 border border-white/10 hover:border-neonCyan cursor-pointer transition">
                            <input type="radio" name="tier" value="100" class="accent-neonCyan mr-3">
                            <div>
                                <div class="text-xs font-bold text-white">Tier 1 (0 – 100 km)</div>
                                <div class="text-[10px] text-gray-400 uppercase font-mono mt-0.5">Rs. 499 + Tax</div>
                            </div>
                        </label>
                        <label class="flex items-center p-4 rounded-2xl bg-white/5 border border-white/10 hover:border-neonCyan cursor-pointer transition">
                            <input type="radio" name="tier" value="500" class="accent-neonCyan mr-3">
                            <div>
                                <div class="text-xs font-bold text-white">Tier 2 (0 – 500 km)</div>
                                <div class="text-[10px] text-gray-400 uppercase font-mono mt-0.5">Rs. 999 + Tax</div>
                            </div>
                        </label>
                        <label class="flex items-center p-4 rounded-2xl bg-white/5 border border-white/10 hover:border-neonCyan cursor-pointer transition">
                            <input type="radio" name="tier" value="2000" class="accent-neonCyan mr-3">
                            <div>
                                <div class="text-xs font-bold text-white">Tier 3 (0 – 2000 km / Country)</div>
                                <div class="text-[10px] text-gray-400 uppercase font-mono mt-0.5">Rs. 1999 + Tax</div>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="cyber-btn w-full bg-gradient-to-r from-neonCyan to-neonPurple text-black font-black py-4 uppercase text-xs tracking-[0.2em] rounded-2xl cursor-pointer">
                    Initialize Lead Search Matrix <i class="fas fa-terminal ml-2"></i>
                </button>
            </form>

            <div id="result" class="mt-8 hidden p-6 rounded-2xl bg-darkBg border border-white/10 text-xs font-mono tracking-wider"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="glass-panel border-t border-white/10 py-6 text-center text-[10px] uppercase tracking-widest text-gray-500">
        <p>&copy; 2026 Client Finder Protocol • Encrypted Backend Node</p>
    </footer>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<span class="text-neonCyan animate-pulse">SYS_CONNECT // Executing pipeline through local backend engine...</span>';

            const payload = {
                email: document.getElementById('email').value,
                client_type: document.getElementById('client_type').value,
                city: document.getElementById('city').value,
                radius: parseInt(document.querySelector('input[name="tier"]:checked').value)
            };

            // Replace with your active local n8n ngrok URL endpoint
            const webhookUrl = "YOUR_N8N_WEBHOOK_URL_HERE";

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="text-emerald-400 font-bold">SUCCESS:</span> Target pipeline executed. Response received from backend node.`;
                } else {
                    resultDiv.innerHTML = `<span class="text-rose-400 font-bold">ACCESS DENIED:</span> ${data.message || "Free trial already used or tier restriction triggered."}`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<span class="text-rose-400 font-bold">UPLINK ERROR:</span> Could not connect to local n8n engine. Verify webhook tunnel status.`;
            }
        });
    </script>
</body>
</html>
